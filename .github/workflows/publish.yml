name: Auto publish

on:
  schedule:
    - cron: "12 6 * * *"
    - cron: "18 13 * * *"
  workflow_dispatch: {}

concurrency:
  group: auto-publish-pitanie
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - run: pip install -r requirements.txt

      - name: Random delay within the triggering hour (09-10 or 16-17 MSK)
        run: sleep $((RANDOM % 3600))

      - name: Publish next queued post
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHANNEL: ${{ secrets.TELEGRAM_CHANNEL }}
        run: python scripts/auto_publish.py

      - name: Commit updated queue
        run: |
          git config user.name "pitanie-nauke-bot"
          git config user.email "actions@users.noreply.github.com"
          git add queue.json
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "chore: publish next queued post"
          for i in 1 2 3 4 5; do
            if git push; then
              exit 0
            fi
            git fetch origin main
            git rebase origin/main
            sleep 3
          done
          echo "::error::Failed to push after retries"
          exit 1
